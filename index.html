<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2e1e">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Truco Futebol">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a2e1e'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<title>Truco Futebol</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.card,summary{touch-action:manipulation}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{--w:clamp(70px,20vw,108px);margin:0;min-height:100vh;min-height:100dvh;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#f4efe0;background:radial-gradient(ellipse at 50% 40%,#17683f,#0a2e1e 80%);display:flex;flex-direction:column;align-items:center;padding-bottom:24px}
body.n4{--w:clamp(60px,17vw,88px)}
body.n6{--w:clamp(62px,15vw,80px)}
header{width:100%;max-width:860px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:10px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;font-weight:800}
.score{display:flex;gap:16px}
.score b{font-size:1.6rem;color:#ffd35a;margin-left:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-weight:700;padding:10px 18px;border-radius:999px;border:0;background:#ffd35a;color:#2a1d00;cursor:pointer}
button:hover{background:#ffe284}
button:focus-visible,.ok:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.sm{padding:6px 12px;font-size:.85rem;background:#ffffff22;color:#f4efe0}
main{width:100%;max-width:860px;display:flex;flex-direction:column;gap:10px;padding:0 10px}
.panel{background:#0006;border-radius:12px;padding:10px 12px;line-height:1.45}
summary{font-weight:800;cursor:pointer}
.mw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.mc{text-align:center;font-size:.78rem}
.mc .card{--w:clamp(66px,18vw,88px);margin:0 auto 4px}
#seats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seat{padding:5px 10px;border-radius:10px;background:#ffffff14;border:2px solid transparent;font-weight:700;font-size:.85rem;text-align:center}
.seat small{display:block;font-weight:400;opacity:.85}
.seat.t0{border-color:#4fa3ff88}.seat.t1{border-color:#ff8a4f88}
.seat.cur{background:#ffd35a40;border-color:#ffd35a}
#tbl{padding:12px 0;border-top:2px dashed #ffffff33;border-bottom:2px dashed #ffffff33;min-height:170px}
.info{position:relative;display:flex;align-items:center;justify-content:center;min-height:calc(clamp(54px,15vw,68px)*1.45 + 24px);padding:0 78px;margin-bottom:8px}
.im{text-align:center}
.vira{position:absolute;right:2px;top:0;text-align:center;font-size:.6rem;font-weight:800;letter-spacing:.1em;cursor:pointer}
.vira .card{--w:clamp(54px,15vw,68px);transform:rotate(7deg);border-radius:8px;border-width:1.5px;padding:3px 3px 2px;margin:2px auto 3px}
.vira .ph{border-width:1px}
.vira .ph>span{font-size:1rem}
.vira .cr{padding:1px 2px;min-width:14px;top:2px;left:2px;border-radius:4px}
.vira .cr b{font-size:.62rem}.vira .cr i{font-size:.55rem}
.vira .cr.b{display:none}
.vira .nm2{font-size:.43rem;letter-spacing:0;min-height:2em;padding:2px 0 1px;-webkit-hyphens:manual;hyphens:manual}
.vira small{display:block;opacity:.9;color:#ffd35a}
.info b{font-size:1.5rem;color:#ffd35a;margin:0 4px}
.dots{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
.dots i{width:12px;height:12px;border-radius:50%;background:#888}
.dots i.w{background:#4fd67e}.dots i.l{background:#e5534b}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ts{text-align:center;font-size:.72rem}
.slot{width:var(--w);height:calc(var(--w)*1.45);border-radius:10px;border:2px dashed #ffffff26}
.card{width:var(--w);height:calc(var(--w)*1.45);flex-shrink:0;background:#fbf7ea;color:#17130d;border:2px solid #161616;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 5px 12px #000b,0 0 0 2px #caa83c;display:flex;flex-direction:column;padding:5px 5px 4px;text-align:center;font-weight:900}
.ph{position:relative;flex:1;min-height:0;border:2px solid #b88d24;border-radius:7px 7px 3px 3px;overflow:hidden;background:linear-gradient(145deg,#e9e0c8,#b5a77e);display:flex;align-items:center;justify-content:center}
.ph>span{font-family:Georgia,"Times New Roman",serif;font-size:2.4rem;color:#514932}
.ph img{position:absolute;top:0;left:0;pointer-events:none;-webkit-user-drag:none;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.cr{position:absolute;top:3px;left:3px;z-index:3;display:flex;flex-direction:column;align-items:center;line-height:.95;background:#fbf7eaf0;border:1px solid #161616;border-radius:5px;padding:2px 4px 3px;min-width:22px;font-family:Georgia,"Times New Roman",serif}
.cr b{font-size:clamp(.8rem,2.4vw,1.15rem)}
.cr i{font-style:normal;font-size:clamp(.75rem,2.2vw,1rem)}
.cr.b{top:auto;left:auto;bottom:3px;right:3px;transform:rotate(180deg)}
.red .cr{color:#c3202b}
.nm2{-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere;padding:4px 1px 3px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(.54rem,1.9vw,.78rem);line-height:1.02;min-height:2.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.02em}
.nm2 small{font-family:"Trebuchet MS","Segoe UI",sans-serif;font-size:.7em;color:#73520a;letter-spacing:.07em;margin-top:2px}
.man{background:linear-gradient(145deg,#fff9d9,#ead17a);border-color:#72520c;box-shadow:0 5px 12px #000b,0 0 0 3px #e4c45a}
.man .ph{border-color:#a77b15}
#me .row{display:flex;justify-content:center;gap:8px}
#me .card.ok{cursor:pointer;transition:transform .15s}
@media (hover:hover){#me .card.ok:hover{transform:translateY(-10px)}}
#me .card.ok:active{transform:translateY(-6px)}
#me .card{--w:clamp(80px,26vw,112px)}
.nm{text-align:center;font-weight:700;margin-top:6px}
#act{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px}
#msg{text-align:center;min-height:1.4em}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:#000c;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:9}
#ov.on{display:flex}
.box{background:#12261c;border:1px solid #ffd35a66;border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;text-align:center}
.box h2{margin:0 0 10px;font-size:1.25rem}
.box p,.box li{line-height:1.45}
.box .l{text-align:left}
.box ol{text-align:left;padding-left:20px}
.cols{columns:2;font-size:.78rem;text-align:left;font-family:monospace}
.bt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.preview-wrap{display:flex;justify-content:center;margin:8px 0 4px}
.preview-wrap .card{--w:clamp(150px,42vw,190px)}
.preview-note{text-align:center;font-size:.75rem;opacity:.8;margin-top:4px}
body.n4 .ph>span,body.n6 .ph>span{font-size:1.6rem}
body.n4 .cr,body.n6 .cr{padding:1px 3px 2px;min-width:18px}
.cback{background:repeating-linear-gradient(45deg,#1d4f9a,#1d4f9a 6px,#173f7c 6px,#173f7c 12px);border-color:#fbf7ea}
.cback .ph{background:none;border:0}
.cback .ph>span{color:#fff;font-size:1.6rem}
.box .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.box .row .card{--w:clamp(60px,17vw,84px)}
.info small{display:block;opacity:.9}
.tagbar{background:#161616;color:#ffd35a;font:800 clamp(.42rem,1.7vw,.6rem)/1 "Trebuchet MS","Segoe UI",sans-serif;letter-spacing:.08em;padding:3px 0;margin-bottom:2px;border-radius:6px 6px 0 0;white-space:nowrap}
#inv{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;background:#12261c;border:2px solid #ffd35a;border-radius:14px;padding:8px 12px;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw;box-shadow:0 6px 20px #000a;font-weight:700}
#who{font-size:.85rem;opacity:.9;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box input{display:block;width:100%;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #ffd35a66;background:#0b1a13;color:#f4efe0;font:inherit;font-size:16px}
.hint{font-size:.8rem;opacity:.85}
.fr{display:flex;align-items:center;gap:8px;text-align:left;margin:6px 0}
.fr span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.fr.off{opacity:.65}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>⚽ Truco Futebol</h1>
  <div class="score" id="score"></div>
  <span id="who"></span>
  <div class="tools"><button class="sm" onclick="friends()">👥 Amigos</button><button class="sm" onclick="howto()">Como jogar</button><button class="sm" onclick="ranking()">Ranking</button><button class="sm" onclick="menu()">Menu</button></div>
</header>
<main>

  <section id="seats"></section>
  <section id="tbl"></section>
  <div id="msg"></div>
  <div id="act"></div>
  <section id="me"></section>
</main>
<div id="inv"></div>
<div id="ov"></div>

let LIMPO=false;
const QI=RK.findIndex(r=>r[0]==='Q');
const lim=()=>G?G.limpo:LIMPO;
const nextB=b=>lim()?(b>=RK.length-1?QI:b+1):(b+1)%RK.length;
const wheel=()=>RK.filter((r,i)=>!lim()||i>=QI).map(r=>r[0]);
function deck(){const d=[];RK.forEach(([r,ns],i)=>{if(G&&G.limpo&&i<QI)return;ns.forEach((n,j)=>d.push({n,r,s:SU[j],b:i,p:i,m:0}))});return d}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let G=null,H=null;
const tm=i=>i%2;
const myN=()=>(ME&&ME.name)||'Você';
const tNames=()=>G.mode==='cpu'?[myN(),'CPU']:G.mode==='online'&&G.N===2?G.names:['Time A','Time B'];
const pn=i=>G.mode==='cpu'?[myN(),'CPU'][i]:G.mode==='online'?G.names[i]:'Jogador '+(i+1);
const meIdx=()=>G.mode==='cpu'?0:G.mode==='online'?G.meSeat:(H&&H.ferro?H.turn:Math.max(G.viewer,0));
const need=()=>H.pend?(H.pend.from+1)%G.N:H.turn;

function cardH(c,extra=''){
  const k=String(c.r),su=c.s,p=PH[slug(c.n)];
  const cr=`<b>${k}</b><i>${su}\uFE0E</i>`;
  return `<div class="card ${c.m?'man':''} ${su==='♥'||su==='♦'?'red':''} ${extra}">${c.m?'<div class="tagbar">★ MANILHA</div>':''}<div class="ph"><span>${c.n[0]}</span>${p?`<img src="${p}" alt="${c.n}">`:''}<div class="cr">${cr}</div><div class="cr b">${cr}</div></div><div class="nm2">${c.n}${c.m?`<small>${c.t.toUpperCase()}</small>`:''}</div></div>`;
}
function modal(t,btns,body=''){
  FR_OPEN=false;if(ROOM)ROOM.lobbyOpen=false;
  const o=$('ov');o.innerHTML=`<div class="box"><h2>${t}</h2>${body}<div class="bt"></div></div>`;
  const b=o.querySelector('.bt');
  btns.forEach(([l,f])=>{const e=document.createElement('button');e.textContent=l;e.onclick=()=>{o.className='';o.innerHTML='';f&&f()};b.append(e)});
  o.className='on';
}
function menu(){
  if(ROOM){if(G&&G.mode==='online')return modal('Partida online',[['Voltar ao jogo',()=>render()],['Sair da partida',leaveOnline]],'<p>Você está numa partida online.</p>');return lobby()}
  modal('⚽ Truco Futebol',[['👥 Jogar online com amigos',()=>online()],['Contra o computador (1x1)',()=>start('cpu',2)],['2 jogadores',()=>start('hot',2)],['4 jogadores (2x2)',()=>start('hot',4)],['6 jogadores (3x3)',()=>start('hot',6)],[LIMPO?'Baralho: LIMPO (24 cartas). Trocar':'Baralho: COMPLETO (40 cartas). Trocar',()=>{LIMPO=!LIMPO;menu()}]],
  '<p>Todo mundo joga no mesmo aparelho: a cada jogada o jogo pede para passar o celular ou computador, escondendo as cartas de quem não está jogando.</p><p>Com 4 ou 6 jogadores, quem senta em posições alternadas forma o mesmo time (Jogadores 1, 3 e 5 contra 2, 4 e 6).</p><p><b>Baralho limpo</b> usa só as cartas mais fortes: Q, J, K, A, 2 e 3. Toque no último botão para escolher o baralho antes de começar.</p><div class="preview-wrap">'+cardH({n:'Maradona',r:'3',s:'♥',m:0})+'</div><div class="preview-note">Exemplo de carta.</div>');
}
function howto(){
  const L=lim(),w=wheel().join(', ');
  const rest=L?'3, 2, A, K, J e Q':'3, 2, A, K, J, Q, 7, 6, 5 e 4';
  modal('Como jogar',[['Entendi']],`<ol>
  <li><b>Objetivo:</b> o time que chegar primeiro a 12 pontos vence a partida. Com 4 ou 6 jogadores os times se alternam na mesa.</li>
  <li><b>Cartas:</b> ${L?'baralho <b>limpo</b>, com 24 cartas (só Q, J, K, A, 2 e 3)':'baralho completo, com 40 cartas'}, e cada carta é um jogador de futebol. Cada pessoa recebe 3 cartas por mão.</li>
  <li><b>Vira e manilha:</b> no começo de cada mão uma carta é virada na mesa, a vira. A vira fica no cantinho da mesa (toque nela para ver as manilhas). A manilha é o valor seguinte ao da vira, na ordem ${w} (depois do 3 volta ao ${L?'Q':'4'}). Os 4 jogadores desse valor viram as cartas mais fortes da mão. Se a vira é um ${L?'J, as manilhas são os K':'6, as manilhas são os 7'}. O naipe da vira não importa.</li>
  <li><b>Ordem entre as manilhas:</b> o naipe desempata. Zap (♣) é a mais forte, depois Copas (♥), Espadilha (♠) e Pica-fumo (♦). Duas manilhas nunca empatam. Nas cartas comuns o naipe não conta. Toda manilha que aparecer na sua mão (ou na mesa) vem com a etiqueta <b>★ MANILHA</b> e o nome dela.</li>
  <li><b>Depois das manilhas:</b> ${rest}, nessa ordem. O valor que virou manilha sai dessa lista nessa mão.</li>
  <li><b>Rodada e mão:</b> cada jogador joga uma carta e a mais forte leva a rodada para o time dele. Quem ganhou começa a próxima. Cada mão tem até 3 rodadas, o time que ganhar 2 leva a mão e marca 1 ponto.</li>
  <li><b>Empates:</b> se empatar a 1ª rodada, quem ganhar a 2ª leva a mão. Se empatar a 2ª, vale quem ganhou a 1ª. Se empatar a 1ª e a 2ª, vale a 3ª. Se empatar a 3ª, vale quem ganhou a 1ª. Se empatar as três, ninguém pontua.</li>
  <li><b>Truco, seis, nove e doze:</b> só dá para pedir na sua vez, antes de jogar a carta. Se o outro time aceitar, a mão passa a valer 3, depois 6, 9 e 12 (doze vale o jogo). Quem acabou de aumentar não pode aumentar de novo, só o outro time.</li>
  <li><b>Correr:</b> quem pediu leva o valor de antes do pedido: truco recusado vale 1 ponto, seis recusado vale 3, nove recusado vale 6 e doze recusado vale 9.</li>
  <li><b>Esconder carta:</b> na sua vez, toque em "Esconder carta" e depois na carta que quer jogar virada. Ela perde de qualquer carta aberta e serve para blefar, e ninguém vê qual era. Quem joga primeiro na rodada não pode esconder. Do segundo em diante vale em qualquer rodada, inclusive a primeira.</li>
  <li><b>Mão de onze:</b> quando um time chega a 11 pontos, os jogadores dele podem ver as cartas uns dos outros e decidir. Se aceitarem, a mão já começa valendo 3. Se correrem, o outro time ganha 1 ponto. Nessa mão o time com 11 não pode pedir truco, seis, nove nem doze (quem pede perde o jogo, por isso o botão some). Só pode aceitar ou correr dos aumentos do outro time.</li>
  <li><b>Mão de ferro:</b> se os dois times chegam a 11, a mão é jogada às cegas: as cartas aparecem viradas e ninguém sabe o que vai jogar. Não dá para correr, esconder carta nem pedir truco, e quem vencer a mão ganha o jogo. Se empatar tudo, é dada outra mão de ferro.</li></ol>`);
}

function start(mode,N){G={mode,N,limpo:LIMPO,score:[0,0],dealer:-1,viewer:0};document.body.className='n'+N;newHand()}
function newHand(){
  const N=G.N,d=shuffle(deck());G.dealer=(G.dealer+1)%N;const f=G.dealer;
  const vi=d[N*3],mi=nextB(vi.b);
  d.forEach(c=>{if(c.b===mi){c.p=20+SO[c.s];c.m=1;c.t=TT[c.s]}});
  const sc=G.score,fe=sc[0]===11&&sc[1]===11,m11=fe?-1:sc[0]===11?0:sc[1]===11?1:-1;
  H={c:Array.from({length:N},(_,i)=>d.slice(i*3,i*3+3)),t:Array(N).fill(null),n:0,r:[],turn:f,first:f,lead:f,v:fe?12:1,last:-1,pend:null,lock:false,over:false,msg:'',vira:vi,mi,ferro:fe,m11,dec:!fe&&m11>=0,decSeen:false,hide:false};
  if(H.dec){H.lock=true;H.msg=G.mode==='cpu'&&m11===1?'CPU está decidindo a mão de onze...':G.mode==='online'?'Mão de onze: o time com 11 pontos está decidindo...':''}

}
function hw(r){
  const [a,b,c]=r;
  if(a===undefined)return -1;
  if(a!=='t'){
    if(b===undefined)return -1;
    if(b==='t'||b===a)return a;
    if(c===undefined)return -1;
    return c==='t'?a:c;
  }
  if(b===undefined)return -1;
  if(b!=='t')return b;
  if(c===undefined)return -1;
  return c==='t'?null:c;
}
const canT=p=>!H.over&&!H.lock&&!H.pend&&!H.ferro&&H.turn===p&&H.v<12&&H.last!==tm(p)&&H.m11!==tm(p);

  if(H.pend&&G.mode==='online'&&(H.pend.from+1)%N!==me)m+=(m?' — ':'')+'Aguardando '+pn((H.pend.from+1)%N)+' responder';

function render(){render0();if(G&&G.mode==='online'&&G.host)pub()}
$('me').addEventListener('click',e=>{const el=e.target.closest('[data-i]');if(el)play(meIdx(),+el.dataset.i,H.hide)});

const gst=()=>G&&G.mode==='online'&&!G.host;
function send(o){if(!ROOM)return;o.s=G.meSeat;dbw('POST',`rooms/${ROOM.id}/act`,JSON.stringify(o)).catch(()=>{})}
function play(p,i,hide){
  if(gst())return send({t:'p',i,h:hide?1:0});
  if(H.over||H.lock||H.pend||H.turn!==p||!H.c[p][i])return;
  const c=H.c[p].splice(i,1)[0];
  const hid=!!hide&&H.n>0&&!H.ferro;
  H.t[p]=hid?{...c,hid:1}:c;H.n++;H.hide=false;
  H.msg=hid?pn(p)+' escondeu uma carta':'';
  if(H.n===G.N){H.lock=true;render();{const h0=H;setTimeout(()=>{if(H===h0)resolve()},1700)}}
  else{H.turn=(p+1)%G.N;render();next()}
}
function resolve(){
  const N=G.N,mx=Math.max(...H.t.map(pw));let w=null,tie=false;
  for(let k=0;k<N;k++){const s=(H.lead+k)%N;if(pw(H.t[s])===mx){if(w===null)w=s;else if(tm(s)!==tm(w))tie=true}}
  const res=tie?'t':tm(w);
  H.r.push(res);
  H.msg=tie?'Empatou!':(G.mode==='cpu'?pn(w):tNames()[tm(w)]+' ('+pn(w)+')')+' levou a rodada';
  H.t=Array(N).fill(null);H.n=0;H.lock=false;
  const x=hw(H.r);
  if(x!==-1)return endHand(x);
  H.lead=tie?H.first:w;H.turn=H.lead;
  render();next();
}
function endHand(w,why=''){
  const tn=tNames();H.over=true;H.lock=false;H.pend=null;H.dec=false;
  if(w!==null)G.score[w]+=H.v;
  const txt=w===null?(H.ferro?'Mão de ferro empatada: vai outra!':'Mão empatada: ninguém pontua.'):H.ferro?`${tn[w]} venceu a mão de ferro!`:`${tn[w]} ganha ${H.v} ponto${H.v>1?'s':''}${why}!`;
  const win=G.score[0]>=12?0:G.score[1]>=12?1:-1;
  H.gameOver=win>=0;
  H.endTxt=win>=0?`🏆 ${tn[win]} venceu o jogo!`:txt;
  const sub=`<p>Placar${win>=0?' final':''}: ${G.score[0]} x ${G.score[1]}</p>`;
  render();
  const on=G.mode==='online';
  if(win>=0)modal(H.endTxt,on?[['Sair',leaveOnline]]:[['Jogar de novo',()=>start(G.mode,G.N)],['Menu',menu]],sub);
  else if(on){modal(H.endTxt,[],sub+'<p>A próxima mão começa já...</p>');const h0=H;setTimeout(()=>{if(H===h0)newHand()},3800)}
  else modal(H.endTxt,[['Próxima mão',newHand]],sub);
}
function truco(p){
  if(gst()){if(canT(p))send({t:'t'});return}
  if(!canT(p))return;
  H.pend={from:p,to:NEXT[H.v]};H.msg='';render();next();
}
function answer(q,a){
  if(gst())return send({t:'a',a});
  const pd=H.pend;if(!pd)return;
  if(a==='n'){H.pend=null;return endHand(tm(pd.from),' (o outro time correu)')}
  H.v=pd.to;H.last=tm(pd.from);H.pend=null;
  if(a==='r'&&NEXT[H.v]&&H.m11!==tm(q)){H.pend={from:q,to:NEXT[H.v]};H.last=tm(q)}
  H.msg=a==='y'?'Aceitou!':'';
  render();next();
}

// ---- Computador (só no modo 1x1) ----
function next(){
  if(!G||G.mode!=='cpu'||H.over)return;
  if(H.dec){if(H.m11===1)setTimeout(cpuDec,1300);return}
  if(H.lock)return;
  if(H.pend){if(H.pend.from===0)setTimeout(cpuAns,1000);return}
  if(H.turn===1)setTimeout(cpuMove,1000);
}
function str(){
  const c=H.c[1];if(!c.length)return 0;
  const ps=c.map(x=>x.p/23);
  let s=.6*Math.max(...ps)+.4*ps.reduce((a,b)=>a+b)/ps.length;
  H.r.forEach(w=>{if(w===1)s+=.12;else if(w===0)s-=.12});
  return s;
}
function cpuDec(){if(!H.dec||H.m11!==1)return;a11(str()+(Math.random()-.5)*.3>.45?'y':'n')}
function cpuMove(){
  if(H.over||H.lock||H.pend||H.turn!==1)return;
  const c=H.c[1];
  if(H.ferro)return play(1,Math.floor(Math.random()*c.length));
  const s=str();
  if(canT(1)&&Math.random()<(s>.62?.4:s>.45?.12:.05))return truco(1);
  const o=H.t[0];
  const idx=[...c.keys()].sort((a,b)=>c[a].p-c[b].p);
  let i,hide=false;
  if(o){const k=idx.find(j=>c[j].p>pw(o));if(k!==undefined)i=k;else{i=idx[0];hide=H.n>0&&Math.random()<.35}}
  else i=Math.random()<.5?idx[idx.length-1]:idx[idx.length>>1];
  play(1,i,hide);
}
function cpuAns(){
  const pd=H.pend;if(!pd||pd.from!==0||H.over)return;
  const s=str()+(Math.random()-.5)*.25;
  const thr={3:.48,6:.58,9:.66,12:.74}[pd.to];
  if(s>thr+.15&&NEXT[pd.to]&&H.m11!==1&&Math.random()<.5)answer(1,'r');
  else if(s>thr)answer(1,'y');
  else answer(1,'n');
}

const dbget=p=>fetch(dbu(p)).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
function apply(c,path,d,merge){
  const k=path.split('/').filter(Boolean);let o=c,key='v';
  for(const x of k){if(o[key]===null||typeof o[key]!=='object')o[key]={};o=o[key];key=x}
  if(d===null){if(k.length)delete o[key];else o[key]=null}
  else if(merge&&typeof d==='object'&&o[key]&&typeof o[key]==='object'){for(const q in d){if(d[q]===null)delete o[key][q];else o[key][q]=d[q]}}
  else o[key]=d;
}
function listen(p,cb){
  const c={v:null},es=new EventSource(dbu(p));
  es.addEventListener('put',e=>{try{const m=JSON.parse(e.data);apply(c,m.path,m.data,false);cb(c.v)}catch(x){}});
  es.addEventListener('patch',e=>{try{const m=JSON.parse(e.data);apply(c,m.path,m.data,true);cb(c.v)}catch(x){}});
  return()=>es.close();
}

  if(!DB_URL)return modal('Amigos',[['Fechar']],'<p>O modo online ainda não foi ativado neste site.</p>');
  const us=userList();
  let b=`<p class="l">Você: <b>${ME.name}</b> · galera: <b>${ME.group}</b><br>${PR.ok?'🟢 conectado':PR.ok===false?'⚪ sem conexão com o servidor':'conectando...'}</p>`;
  b+=us.length?us.map(u=>`<p class="fr ${u.on?'':'off'}">${u.on?'🟢':'⚪'} <span>${u.n}</span>${u.on?`<button class="sm" onclick="invite('${u.id}')">Convidar</button>`:'<small>offline</small>'}</p>`).join(''):'<p class="l">Ninguém mais entrou nessa galera ainda. Mande o link do jogo e o código da galera para os amigos.</p>';
  modal('Amigos',[['Jogar online',()=>online()],['Trocar nome',()=>loginModal()],['Fechar']],b);
  FR_OPEN=true;
}
function online(){
  if(!ME)return loginModal();
  if(!DB_URL)return modal('Online',[['Voltar',menu]],'<p>O modo online ainda não foi ativado neste site.</p>');
  modal('Jogar online',[['1x1',()=>createRoom(2)],['2x2 (4 jogadores)',()=>createRoom(4)],['3x3 (6 jogadores)',()=>createRoom(6)],['Voltar',menu]],'<p>Crie uma sala e convide os amigos que estão online. Baralho: <b>'+(LIMPO?'limpo':'completo')+'</b> (troque no menu).</p>');
}

// ---- convites ----
const inMatch=()=>!!(G&&G.mode==='online'&&H&&!(H.over&&H.gameOver));
function onInv(v){
  PR.invs=Object.entries(v||{}).map(([k,t])=>{try{const o=JSON.parse(t);return{key:k,n:clean(o.n)||'?',r:slugId(o.r),N:+o.N,ts:+o.ts}}catch(e){return null}}).filter(o=>o&&o.r&&nowS()-o.ts<120000);
  showInv();
}
function showInv(){
  const el=$('inv'),it=PR.invs[0];
  if(!it||inMatch()){el.style.display='none';el.innerHTML='';return}
  el.innerHTML=`<span><b>${it.n}</b> te chamou para jogar ${it.N===2?'1x1':it.N===4?'2x2':'3x3'}</span><button onclick="accInv()">Aceitar</button><button class="sm" onclick="decInv()">Recusar</button>`;
  el.style.display='flex';
}
function decInv(){const it=PR.invs.shift();if(it)dbw('DELETE',`g/${ME.group}/inv/${ME.uid}/${it.key}`).catch(()=>{});showInv()}
function accInv(){const it=PR.invs.shift();if(!it)return;dbw('DELETE',`g/${ME.group}/inv/${ME.uid}/${it.key}`).catch(()=>{});showInv();joinRoom(it.r)}
async function invite(uid){
  if(!ROOM||!ROOM.host)await createRoom(2,true);
  if(!ROOM)return;
  try{await dbw('POST',`g/${ME.group}/inv/${uid}`,JSON.stringify({n:ME.name,r:ROOM.id,N:ROOM.N,ts:nowS()}));ROOM.inv[uid]=1}catch(e){toast('Não consegui enviar o convite.')}
  lobby();
}

// ---- salas ----
const wm=()=>dbw('PUT',`rooms/${ROOM.id}/m`,JSON.stringify({N:ROOM.N,limpo:ROOM.limpo,st:ROOM.st,seats:ROOM.seats}));
function endRoom(){
  if(!ROOM)return;const r=ROOM;ROOM=null;
  ['lj','lm','vl','la'].forEach(k=>r[k]&&r[k]());
  dbw('DELETE',r.host?`rooms/${r.id}`:`rooms/${r.id}/j/${ME.uid}`).catch(()=>{});
}
function leaveOnline(){endRoom();G=null;H=null;menu()}
function closeRoom(){endRoom();menu()}
async function createRoom(N,quiet){
  if(ROOM)endRoom();
  const id=Math.random().toString(36).slice(2,8);
  ROOM={id,host:true,N,limpo:LIMPO,st:'lobby',seats:[{uid:ME.uid,n:ME.name}],inv:{}};
  try{await wm()}catch(e){ROOM=null;return toast('Não consegui criar a sala.')}
  ROOM.lj=listen(`rooms/${id}/j`,onJoin);
  if(!quiet)lobby();
}
function onJoin(v){
  if(!ROOM||!ROOM.host||ROOM.st!=='lobby'||!v)return;
  let ch=false;
  for(const [uid,n] of Object.entries(v)){
    if(uid===slugId(uid)&&!ROOM.seats.some(x=>x.uid===uid)&&ROOM.seats.length<ROOM.N){ROOM.seats.push({uid,n:clean(n)||'?'});ch=true}
  }
  if(ch){wm().catch(()=>{});if(ROOM.lobbyOpen)lobby()}
}
async function joinRoom(id){
  if(ROOM)endRoom();
  let m=null;try{m=JSON.parse((await dbget(`rooms/${id}/m`))||'null')}catch(e){}
  if(!m||m.st!=='lobby')return toast('Essa sala não está mais aberta.');
  ROOM={id,host:false,m};LQ=0;
  try{await dbw('PUT',`rooms/${id}/j/${ME.uid}`,ME.name)}catch(e){ROOM=null;return toast('Não consegui entrar na sala.')}
  ROOM.lm=listen(`rooms/${id}/m`,t=>{if(!ROOM||ROOM.id!==id)return;let x=null;try{x=t?JSON.parse(t):null}catch(e){}ROOM.m=x;guestUpdate()});
  lobby();
}
function guestUpdate(){
  const m=ROOM.m;
  if(!m){const was=!!ROOM.vl;endRoom();toast('A sala foi encerrada.');if(was){G=null;H=null}menu();return}
  const seat=m.seats.findIndex(x=>x.uid===ME.uid);
  if(seat<0){if(m.seats.length>=m.N){endRoom();toast('A sala está cheia.');menu()}else if(ROOM.lobbyOpen)lobby();return}
  if(m.st==='play'&&!ROOM.vl){ROOM.seat=seat;ROOM.lobbyOpen=false;ROOM.vl=listen(`rooms/${ROOM.id}/v/${seat}`,applyView);return}
  if(!ROOM.vl&&ROOM.lobbyOpen)lobby();
}
function lobby(){
  if(!ROOM)return;
  const m=ROOM.host?ROOM:ROOM.m;if(!m)return;
  const N=m.N,seats=m.seats||[];
  let b=`<p>Sala ${N===2?'1x1':N===4?'2x2':'3x3'} · baralho ${m.limpo?'limpo':'completo'}</p>`+[...Array(N).keys()].map(i=>`<p class="l">${i+1}. ${seats[i]?'<b>'+clean(seats[i].n)+'</b>':'<i>aguardando...</i>'} <small>(${N===2?'':i%2?'Time B':'Time A'})</small></p>`).join('');
  const btns=[];
  if(ROOM.host){
    const us=userList().filter(u=>u.on&&!seats.some(x=>x.uid===u.id));
    b+='<p class="l"><b>Convidar amigos online:</b></p>'+(us.length?us.map(u=>`<p class="fr">🟢 <span>${u.n}</span><button class="sm" onclick="invite('${u.id}')">${ROOM.inv[u.id]?'Convidar de novo':'Convidar'}</button></p>`).join(''):'<p class="l">Nenhum amigo online agora.</p>');
    if(seats.length>=N)btns.push(['Começar',startOnline]);
    btns.push(['Cancelar sala',closeRoom]);
  }else{b+='<p>Esperando o anfitrião começar...</p>';btns.push(['Sair',leaveOnline])}
  modal('Sala online',btns,b);
  ROOM.lobbyOpen=true;
}

// ---- partida online: o anfitrião roda o jogo, os convidados recebem só a própria visão ----
function startOnline(){
  const r=ROOM;if(!r||!r.host||r.seats.length<r.N)return;
  r.st='play';r.lobbyOpen=false;wm().catch(()=>{});
  G={mode:'online',N:r.N,limpo:r.limpo,score:[0,0],dealer:-1,viewer:0,names:r.seats.map(x=>x.n),meSeat:0,host:true};
  document.body.className='n'+r.N;
  ACTDONE.clear();
  r.la=listen(`rooms/${r.id}/act`,onAct);
  newHand();
}
function onAct(v){
  if(!v||!H||!G||G.mode!=='online'||!ROOM)return;
  Object.keys(v).sort().forEach(k=>{
    if(ACTDONE.has(k))return;ACTDONE.add(k);
    dbw('DELETE',`rooms/${ROOM.id}/act/${k}`).catch(()=>{});
    let o;try{o=JSON.parse(v[k])}catch(e){return}
    const s=o&&o.s;if(!(Number.isInteger(s)&&s>0&&s<G.N))return;
    if(o.t==='p'&&H.turn===s&&Number.isInteger(o.i))play(s,o.i,!!o.h);
    else if(o.t==='t'&&H.turn===s)truco(s);
    else if(o.t==='a'&&H.pend&&(H.pend.from+1)%G.N===s&&['y','n','r'].includes(o.a))answer(s,o.a);
    else if(o.t==='e'&&H.dec&&tm(s)===H.m11&&['y','n'].includes(o.a))a11(o.a);
  });
}
function viewFor(s){
  const T=tm(s);
  const c=H.c.map((h,i)=>(i===s||(H.dec&&tm(i)===H.m11&&T===H.m11))?h:h.map(()=>0));
  const t=H.t.map(x=>x?(x.hid?{hid:1}:x):null);
  return {q:++SEQ,G:{mode:'online',N:G.N,limpo:G.limpo,score:G.score,names:G.names,meSeat:s,host:false},H:{...H,c,t,hide:false}};
}
function pub(){
  if(pq)return;
  pq=setTimeout(()=>{pq=0;PCH=PCH.then(async()=>{
    if(!G||!H||!ROOM||!ROOM.host||G.mode!=='online')return;
    for(let s=1;s<G.N;s++){try{await dbw('PUT',`rooms/${ROOM.id}/v/${s}`,JSON.stringify(viewFor(s)))}catch(e){}}
  })},40);
}
function applyView(t){
  let o;try{o=JSON.parse(t)}catch(e){return}
  if(!o||!o.G||!o.H||o.q<LQ)return;LQ=o.q;
  const nv=!H||!H.vira||H.vira.n!==o.H.vira.n||H.vira.s!==o.H.vira.s;
  G=o.G;H=o.H;document.body.className='n'+G.N;
  if(nv)manPanel();
  render();
}
function boot(){
  try{ME=JSON.parse(lsGet('truco_me')||'null')}catch(e){ME=null}
  if(ME&&(!ME.uid||!ME.name))ME=null;
  setWho();
  if(!ME){loginModal();return}
  goOnline();menu();
}

let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
document.addEventListener('click',keepAwake,{once:true});
manPanel();$('man').open=innerWidth>=600;
boot();
</script>
</body>
